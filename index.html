<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Oficina Embrujada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=Alegreya+Sans:wght@400;700&display=swap">
<style>
:root{--ink:#170f24;--mist:#2a1c3d;--line:#4a3566;--bone:#f1e8d6;--dim:#b9a9d0;--pump:#f28a1c;--wine:#c4325f;--ok:#7bd88f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3b2160 0,var(--ink) 60%) fixed var(--ink);color:var(--bone);font:18px/1.55 "Alegreya Sans",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:16px 18px 48px}
h1,h2{font-family:Creepster,"Chalkduster",fantasy;font-weight:400;letter-spacing:.04em;margin:0}
h1{font-size:clamp(2.6rem,9vw,4.2rem);color:var(--pump);line-height:1;text-shadow:0 0 24px #f28a1c66}
h2{font-size:1.9rem;color:var(--bone)}
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.clock{font:700 1.6rem/1 "Special Elite",monospace;color:var(--pump);min-width:4.2ch}
.clock.low{color:var(--wine);animation:pulse 1s infinite}
.seals{display:flex;gap:8px}
.seal{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font:700 1.1rem "Special Elite",monospace;color:var(--dim)}
.seal.on{border:2px solid var(--pump);background:var(--pump);color:var(--ink)}
.rooms{color:var(--dim);font-size:.95rem}
.paper{background:var(--bone);color:#2b2230;border-radius:4px;padding:18px 20px;margin:16px 0;font:1rem/1.6 "Special Elite",monospace;box-shadow:4px 6px 0 #0006;transform:rotate(-.4deg)}
.paper p{margin:.3em 0}
.story{color:var(--dim);font-style:italic}
.q{font-weight:700;margin:18px 0 8px}
input[type=text]{width:100%;font:inherit;font-size:1.2rem;padding:12px 14px;border-radius:8px;border:2px solid var(--line);background:var(--mist);color:var(--bone);letter-spacing:.06em}
input[type=text]:focus-visible,button:focus-visible{outline:3px solid var(--pump);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{font:700 1rem "Alegreya Sans",sans-serif;padding:12px 20px;border-radius:8px;border:2px solid var(--pump);background:var(--pump);color:var(--ink);cursor:pointer}
button.ghost{background:transparent;color:var(--pump)}
button.opt{display:block;width:100%;text-align:left;background:var(--mist);border-color:var(--line);color:var(--bone);font-family:"Special Elite",monospace;font-weight:400;margin-top:8px}
button.opt:hover{border-color:var(--pump)}
.msg{min-height:1.6em;margin-top:10px;font-weight:700}
.msg.bad{color:var(--wine)}.msg.good{color:var(--ok)}.msg.hint{color:var(--pump);font-weight:400}
.shake{animation:shake .4s}
.reveal{border:2px solid var(--ok);border-radius:10px;padding:14px 18px;margin-top:16px;background:#7bd88f14}
.cert{border:3px double var(--pump);padding:26px 18px;text-align:center;background:var(--mist);border-radius:6px;margin:18px 0}
.big{font-size:3.4rem;margin:0}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

#scare{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#6a0014 0,#000 72%);cursor:pointer;text-align:center;padding:20px}
#scare.on{display:flex;animation:flick .4s 2,jolt .1s 8}
#scare h2{color:#ff3b3b;font-size:clamp(2rem,9vw,3.6rem);margin-top:8px;text-shadow:0 0 22px #f00}
#scare small{color:var(--dim);margin-top:6px}
.eye{animation:pulse .5s infinite}
@keyframes flick{50%{filter:brightness(1.8)}}
@keyframes jolt{25%{transform:translate(-6px,4px)}75%{transform:translate(6px,-4px)}}
.brand{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:8px 0;background:var(--ink)}
.brand img{height:38px;width:auto;max-width:70%}
.brand span{font-family:Creepster,fantasy;font-size:1.45rem;letter-spacing:.05em;color:var(--pump)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:10}
#okscr{position:fixed;inset:0;z-index:98;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#2b6a3a 0,#0d0718 72%);cursor:pointer;text-align:center;padding:20px}
#okscr.on{display:flex;animation:rise .5s}
#okscr h2{color:var(--ok);font-size:clamp(2rem,9vw,3.6rem);margin-top:8px;text-shadow:0 0 22px #7bd88f}
#okscr small{color:var(--dim);margin-top:6px}
.glow{animation:glow .9s infinite alternate}
@keyframes rise{from{opacity:0;transform:scale(.92)}}
@keyframes glow{to{filter:drop-shadow(0 0 18px #7bd88f)}}
.hud{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;background:var(--ink)}
.hud[hidden]{display:none}
#scare small,#okscr small{font-size:clamp(1.4rem,5.5vw,2.2rem);font-weight:700;color:var(--bone);margin-top:14px}
.reveal{font-size:1.35rem}
.rank{width:100%;border-collapse:collapse;font-family:"Special Elite",monospace;margin:8px 0 16px}
.rank td{padding:6px 8px;border-bottom:1px solid var(--line)}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
// Pegá acá la dirección que te da Google al implementar el script (termina en /exec)
const ENDPOINT='https://script.google.com/macros/s/AKfycbwnjRk-tQ1UXgUmHxDjFE24caRTb2qw-KCCHQA_YHyNM9Otnq8_-X_qNnB4FaWExUHdBA/exec';
const TOTAL=2400;
const rooms=[
{n:'La sala de reuniones maldita',e:'🪑',
 story:'La puerta se cierra sola. En la mesa quedó el acta de una reunión que nunca terminó. Dicen que el fantasma escondió un mensaje en los turnos de palabra.',
 body:'<p>ACTA N.º 666 · Turnos de palabra</p><p>Turno 5: No me escuchan, ¿verdad?</p><p>Turno 2: Disculpen, estaba en silencio.</p><p>Turno 7: Olvidé el archivo, lo mando después.</p><p>Turno 1: Alguien tiene el link de la reunión.</p><p>Turno 4: Una última cosa y cerramos.</p><p>Turno 6: Tengo otra reunión en cinco minutos.</p><p>Turno 3: Justo iba a decir lo mismo.</p>',
 q:'Ordená las frases por turno y tomá la inicial de cada una. Forman lo que siempre se olvida de mandar. ¿Qué palabra es?',
 type:'text',ans:['adjunto','archivoadjunto'],hint:'Ordená del turno 1 al 7 y leé solo la primera letra de cada frase.',seal:'3'},
{n:'El comedor y la heladera',e:'🥡',
 story:'En la heladera hay cuatro tuppers (fideos, tarta, guiso y ensalada) y cuatro dueños (Marta, Jorge, Laura y Pablo). Las etiquetas se borraron y solo quedaron estas notas pegadas en la puerta.',
 body:'<p>1. El tupper de Pablo es el más reciente de todos.</p><p>2. El guiso es más nuevo que los fideos, pero más viejo que la ensalada.</p><p>3. La tarta es más vieja que los fideos y no es ni de Marta ni de Laura.</p><p>4. Los fideos no son de Laura.</p>',
 q:'¿De quién es el guiso?',
 type:'text',ans:['laura'],hint:'Ordená los cuatro tuppers del más viejo al más nuevo con las notas 2 y 3. Después asigná dueños.',seal:'7'},
{n:'El archivo fantasma',e:'🗄️',
 story:'El sistema renombra el informe cada vez que alguien lo abre. El único que no está corrompido es el que sigue en la serie.',
 body:'<p>📄 Informe_v1</p><p>📄 Informe_v2</p><p>📄 Informe_v3</p><p>📄 Informe_v5</p><p>📄 Informe_v8</p><p>📄 Informe_v13</p><p>📄 Informe_v??</p>',
 q:'¿Qué número lleva la próxima versión?',
 type:'text',ans:['21','v21'],hint:'Mirá cómo se obtiene cada número a partir de los dos anteriores.',seal:'1'},
{n:'La sala de sistemas',e:'💻',
 story:'El wifi está poseído y la pantalla muestra un mensaje cifrado. El técnico dejó una nota: “Es lo que nadie hizo antes del desastre. Lo escribí al revés y corrí cada letra hacia adelante tantas posiciones como letras tiene la palabra WIFI.”',
 body:'<p>Mensaje en pantalla:</p><p style="font-size:1.5rem;letter-spacing:.2em"><b>TYOGEF</b></p>',
 q:'Descifrá la palabra. Está en inglés, pero se usa en toda oficina.',
 type:'text',ans:['backup'],hint:'Retrocedé 4 letras cada una (T es P) y después leé la palabra de atrás para adelante.',seal:'9'},
{n:'La oficina del jefe fantasma',e:'👻',
 story:'La caja fuerte guarda el formulario de licencia aprobado. Necesitás los cuatro sellos, pero el fantasma lee todo al revés: el código va del último sello al primero.',
 body:'<p>🔒 [ _ _ _ _ ]</p>',
 q:'Ingresá el código de 4 dígitos.',
 type:'text',ans:['9173'],hint:'Leé los sellos naranjas de derecha a izquierda.',seal:''}
];
let team='';
let st={screen:'intro',i:0,seals:[],t:TOTAL,solved:false,timer:null};

function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function hud(){
  $('#hud').hidden=!(st.screen==='room');
  $('#clock').textContent=fmt(st.t);
  $('#clock').classList.toggle('low',st.t<=300);
  $('#where').textContent='Sala '+(st.i+1)+' de '+rooms.length;
  $('#seals').innerHTML=[0,1,2,3].map(k=>'<div class="seal'+(st.seals[k]?' on':'')+'">'+(st.seals[k]||'?')+'</div>').join('');
}
function start(){
  st={screen:'room',i:0,seals:[],t:TOTAL,solved:false,timer:null,h:0,e:0};
  clearInterval(st.timer);
  st.timer=setInterval(()=>{st.t--;if(st.t<=0){st.t=0;end(false)}hud()},1000);
  render();
}
function end(win){clearInterval(st.timer);st.screen=win?'win':'lose';st.sent='pending';sendResult(win);render()}
function render(){
  const s=$('#stage');
  if(st.screen==='intro'){
    s.innerHTML='<h1>La Oficina Embrujada</h1><p class="story" style="margin-top:14px">Es viernes de Halloween y el equipo se quedó trabajando hasta tarde. De repente se apagan las luces, las puertas se traban y aparece un mensaje en la pantalla:</p><div class="paper"><p>“Soy el fantasma del último empleado que nunca pudo tomarse vacaciones. Si quieren salir, completen mi formulario de licencia. Pero está maldito.”</p></div><p>Tienen <b>40 minutos</b> para resolver 5 salas y escapar antes de que amanezca el lunes. Cada pista cuesta 1 minuto y cada error, 30 segundos.</p><p class="q">Nombre del equipo</p><input type="text" id="team" maxlength="30" autocomplete="off" aria-label="Nombre del equipo" placeholder="Ej.: Los Sobrevivientes" onkeydown="if(event.key===\'Enter\')begin()"><div class="msg bad" id="tmsg"></div><div class="row"><button onclick="begin()">Entrar a la oficina</button></div>';
    hud();return;
  }
  if(st.screen==='win'){
    const used=TOTAL-st.t;
    s.innerHTML='<div class="cert"><p class="big">🎃</p><h2>¡Escaparon!</h2><p>Equipo <b>'+esc(team)+'</b></p><p>Certificado de Sobreviviente de la Oficina Embrujada</p><p>Tiempo: <b>'+fmt(used)+'</b></p><p class="story">El fantasma por fin se tomó vacaciones. Ahora sí, a disfrutar el fin de semana.</p></div>'+status()+'<div class="row"><button class="ghost" onclick="start()">Jugar de nuevo</button></div>';
    hud();return;
  }
  if(st.screen==='lose'){
    s.innerHTML='<div class="cert"><p class="big">💀</p><h2>Amaneció el lunes</h2><p>Se acabó el tiempo y el fantasma les asignó tareas pendientes para toda la semana.</p></div>'+status()+'<div class="row"><button onclick="start()">Volver a intentarlo</button></div>';
    hud();return;
  }
  const r=rooms[st.i];
  let input;
  if(r.type==='choice'){input=r.opts.map((o,k)=>'<button class="opt" onclick="check('+k+')">'+o+'</button>').join('')}
  else{input='<input type="text" id="ans" autocomplete="off" aria-label="Respuesta" placeholder="Escribí tu respuesta" onkeydown="if(event.key===\'Enter\')check()"><div class="row"><button onclick="check()">Probar</button><button class="ghost" onclick="hint()">Pedir pista (−1 min)</button></div>'}
  if(r.type==='choice')input+='<div class="row"><button class="ghost" onclick="hint()">Pedir pista (−1 min)</button></div>';
  s.innerHTML='<h2>'+r.e+' '+r.n+'</h2><p class="story">'+r.story+'</p><div class="paper">'+r.body+'</div><p class="q">'+r.q+'</p>'+input+'<div class="msg" id="msg" role="status"></div><div id="after"></div>';
  hud();
  const a=$('#ans');if(a)a.focus();
}
function msg(t,c){const m=$('#msg');m.textContent=t;m.className='msg '+(c||'');if(c==='bad'){m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake')}}
function hint(){if(st.solved)return;st.h++;st.t=Math.max(1,st.t-60);hud();msg('Pista: '+rooms[st.i].hint,'hint')}
function check(k){
  const r=rooms[st.i];
  const ok=r.type==='choice'?k===r.ans:r.ans.includes(norm($('#ans').value));
  if(!ok){st.e++;st.t=Math.max(1,st.t-30);hud();scare();msg('Incorrecto. Probá de nuevo.','bad');return}
  if(st.i===rooms.length-1){okScreen('');end(true);return}
  st.solved=true;st.seals[st.i]=r.seal;hud();
  okScreen(r.seal);msg('¡Correcto!','good');
  $('#after').innerHTML='<div class="reveal">Conseguiste el sello <b>'+r.seal+'</b>. Guardalo para la caja fuerte.</div><div class="row"><button onclick="next()">Ir a la próxima sala</button></div>';
  document.querySelectorAll('.opt,#ans').forEach(e=>e.disabled=true);
}
function scare(){
  const T=['TE ESTOY MIRANDO','NO PODÉS SALIR','YA ES LUNES','ESA NO ERA LA RESPUESTA'];
  const e=$('#scare');$('#scareTxt').textContent=T[Math.floor(Math.random()*T.length)];e.classList.add('on');
  try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(90,c.currentTime);o.frequency.exponentialRampToValueAtTime(40,c.currentTime+.6);g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.7);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.7)}catch(x){}
  clearTimeout(scare.t);scare.t=setTimeout(()=>e.classList.remove('on'),1800);
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function begin(){const v=$('#team').value.trim();if(!v){$('#tmsg').textContent='Escribí el nombre de tu equipo para empezar.';return}team=v;start()}
async function sendResult(win){
  const s=st;
  const rec={equipo:team,tiempo:win?TOTAL-s.t:TOTAL,escaparon:win,salas:win?rooms.length:s.i,pistas:s.h,errores:s.e};
  try{
    if(!ENDPOINT||ENDPOINT.startsWith('PEGAR'))throw 0;
    await fetch(ENDPOINT,{method:'POST',mode:'no-cors',body:JSON.stringify(rec)});
    s.sent='ok';
    try{const r=await fetch(ENDPOINT);s.rank=await r.json()}catch(x){s.rank=[]}
  }catch(x){s.sent='fail'}
  if(st===s&&(s.screen==='win'||s.screen==='lose'))render();
}
function status(){
  if(st.sent==='fail')return '<p class="msg bad">No se pudo enviar el resultado automáticamente. Avisale a quien organiza el juego: equipo '+esc(team)+', tiempo '+fmt(TOTAL-st.t)+'.</p>';
  if(st.sent!=='ok')return '<p class="story">Enviando resultado…</p>';
  const rows=(st.rank||[]).map((r,k)=>'<tr><td>'+(k+1)+'</td><td>'+esc(r.equipo)+'</td><td>'+fmt(r.tiempo)+'</td></tr>').join('');
  return '<p class="msg good">Resultado enviado.</p>'+(rows?'<h2>Ranking</h2><table class="rank">'+rows+'</table>':'');
}
function okScreen(seal){
  const T=['EL FANTASMA RETROCEDE','LA PUERTA CRUJE Y SE ABRE','ESA ERA LA SALIDA','EL LUNES TODAVÍA ESPERA'];
  const e=$('#okscr');$('#okTxt').textContent=seal?T[Math.floor(Math.random()*T.length)]:'¡LA CAJA FUERTE SE ABRE!';
  $('#okSub').textContent=seal?'Sello '+seal+' conseguido · tocá para seguir':'Escaparon de la oficina';
  e.classList.add('on');
  try{const c=new(window.AudioContext||window.webkitAudioContext)();[392,523,659].forEach((f,k)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+k*.14;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.4)})}catch(x){}
  clearTimeout(okScreen.t);okScreen.t=setTimeout(()=>e.classList.remove('on'),1800);
}
function next(){st.i++;st.solved=false;render()}
render();
</script>
</body>
